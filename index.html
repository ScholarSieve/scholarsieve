            </div>
        </div>
    </nav>

    <main>
        <div class="hero">
            <h1>Find college scholarships</h1>
            <p>Discover new opportunities and apply to scholarships by choosing a category below. Read verified parameters curated automatically via secure data feeds with zero ad redirects or signup gates.</p>
        </div>

        <input type="text" id="user-search" class="search-box" oninput="executeSearch()" placeholder="Search scholarships by title, criteria, or keywords...">

        <div class="filter-group" id="filter-chips-wrapper">
            <!-- Populated dynamically with numerical counting badges -->
        </div>

        <div id="dashboard-view"></div>
    </main>

    <div id="modal-overlay" class="details-overlay" onclick="closeDetailsWindow()">
        <div class="details-window" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeDetailsWindow()">&times;</button>
            <div class="window-body" id="modal-body-content">
            </div>
        </div>
    </div>

    <footer>
        <div class="logo">Scholar<span>sieve</span></div>
        <div class="founder-card">
            <div class="founder-avatar">N</div>
            <div>
                <div style="font-size: 0.65rem; color: #004d3d; font-weight: 700; text-transform: uppercase;">Project Founder</div>
                <div style="font-size: 0.95rem; font-weight: 700; color: #1a202c;">Nikhil</div>
                <div style="font-size: 0.75rem; color: #718096;">Lead Systems Architect</div>
            </div>
        </div>
    </footer>

    <script>
        let grandDatabase = [];
        let activeCategory = 'All';

        // THE LIVE SYNC CORE: Consumes data pushed automatically by your cloud scraper
        async function fetchScholarshipDatabase() {
            try {
                const response = await fetch('live_database.json');
                if (!response.ok) { throw new Error("Cloud stream offline."); }
                grandDatabase = await response.json();
                initializeInterfacePipeline();
            } catch (error) {
                console.log("Syncing database pipeline. Deploying pristine multi-category fallback ledger...");
                grandDatabase = [
                    {
                        category: "Engineering",
                        title: "$40,000 Niche No Essay Scholarship",
                        offered_by: "Niche Higher Education Networks",
                        amount: "$40,000 Flat Grant",
                        deadline: "October 15, 2026",
                        requirements: "None (Open Registration Entry)",
                        overview: "Niche can help with every step of the college search including paying for it. We are giving one student $40,000 to help cover tuition, housing, books, and other college expenses — no essay required! High school seniors who apply can also be eligible to receive acceptance offers from our partners.",
                        application_url: "https://niche.com",
                        faq_q1: "How is the winner selected for this reward?",
                        faq_a1: "A random drawing executes monthly across all validated registration nodes logged into the network stream.",
                        faq_q2: "Can international students apply?",
                        faq_a2: "This specific funding track requires valid citizenship parameters or active high school enrollment profiles."
                    },
                    {
                        category: "Engineering",
                        title: "Reliance Foundation Undergraduate Scholarships 2026-27",
                        offered_by: "Reliance Foundation Corporate CSR",
                        amount: "Up to ₹2,0,000 Total Stipend",
                        deadline: "November 15, 2026",
                        requirements: "1st Year Full-Time Degree Students + Income < 15L",
                        overview: "A prestigious private corporate grant aimed at supporting meritorious students pursuing full-time technical graduation paths across India. Bypasses intermediate channel fees completely.",
                        application_url: "https://reliancefoundation.org",
                        faq_q1: "What does this scholarship wrap cover?",
                        faq_a1: "It supplies up to ₹2 Lakhs over the standard duration of your degree track to handle tuition, textbooks, and computer devices.",
                        faq_q2: "Is there a mandatory selection test?",
                        faq_a2: "Yes, an internal online aptitude clearance test evaluates baseline structural competencies post-registration."
                    },
                    {
                        category: "Govt",
                        title: "PM-USP Central Sector Scholarship Scheme",
                        offered_by: "Department of Higher Education, Ministry of Education, India",
                        amount: "₹20,000 / Year Flat Grant",
                        deadline: "October 31, 2026",
                        requirements: "Family Income < 4.5L + Above 80th Percentile in Board",
                        overview: "Flagship central sector support scheme for top-tier undergraduate university rankers. Requires validated profiles logged onto the official National Scholarship Portal (NSP).",
                        application_url: "https://scholarships.gov.in",
                        faq_q1: "How do I secure tracking validation?",
                        faq_a1: "You must complete Aadhaar e-KYC integration directly on the official state portal to verify academic matching status.",
                        faq_q2: "Can I renew this support in college?",
                        faq_a2: "Yes, maintaining a minimum score baseline of 50% marks each semester ensures annual rollover."
                    },
                    {
                        category: "Engineering",
                        title: "DST INSPIRE Scholarship for Higher Education (SHE)",
                        offered_by: "Department of Science & Technology, Govt of India",
                        amount: "₹80,000 / Year Cash Stipend",
                        deadline: "December 31, 2026",
                        requirements: "Top 1% Rankers in Class 12 Boards pursuing Basic Sciences",
                        overview: "Highly competitive central government program designed to attract talent to core sciences and engineering research tracks right post-school.",
                        application_url: "https://online-inspire.gov.in",
                        faq_q1: "How is the reward money distributed?",
                        faq_a1: "An annual allotment transfers ₹60,000 directly to your account, with ₹20,000 reserved for summer projects.",
                        faq_q2: "Which university courses qualify?",
                        faq_a2: "Natural and basic science courses including physics, mathematics, chemistry, and biology components are covered."
                    },
                    {
                        category: "Govt",
                        title: "Kotak Kanya Scholarship Program 2026-27",
                        offered_by: "Kotak Mahindra Education Foundation (CSR Initiative)",
                        amount: "₹1,50,000 / Year Support",
                        deadline: "October 31, 2026",
                        requirements: "Meritorious Girl Students + 1st Year B.Tech/MBBS + Income < 6L",
                        overview: "Exclusive private foundation fellowship providing complete tuition, library, and hostel expense coverage to highly capable female professional track scholars.",
                        application_url: "https://kotakmahindraeducationfoundation.org",
                        faq_q1: "Does this handle dual-degree programs?",
                        faq_a1: "Yes, it fully protects professional engineering, medicine, and standard architecture tracks.",
                        faq_q2: "What documentation must be submitted?",
                        faq_a2: "Validated rank cards, family income certificate logs, and raw board score sheet files are verified."
                    }
                ];
                initializeInterfacePipeline();
            }
        }

        function initializeInterfacePipeline() {
            renderFilterChips();
            renderInterface();
            renderNotificationHubLogs();
        }

        // IDEA 3: Dynamic Counting Badge Computation
        function getCategoryCount(category) {
            if (category === 'All') return grandDatabase.length;
            return grandDatabase.filter(item => item.category === category).length;
        }

        function renderFilterChips() {
            const wrapper = document.getElementById('filter-chips-wrapper');
            const categories = ['All', 'Engineering', 'Business', 'Medical', 'Govt', 'Abroad'];
            wrapper.innerHTML = '';
            
            categories.forEach(cat => {
                const isActive = (cat === activeCategory) ? 'active' : '';
                const count = getCategoryCount(cat);
                const displayLabel = cat === 'All' ? 'All Opportunities' : 
                                     cat === 'Engineering' ? 'Engineering / Tech' :
                                     cat === 'Business' ? 'Business / IPMAT' :
                                     cat === 'Medical' ? 'Medical / NEET' :
                                     cat === 'Govt' ? 'Government Registers' : 'Global Fellowships';
                                     
                wrapper.innerHTML += `<button class="filter-btn ${isActive}" onclick="filterStream('${cat}')">${displayLabel} <span class="filter-count">${count}</span></button>`;
            });
        }

        function renderInterface() {
            const listWrapper = document.getElementById('dashboard-view');
            listWrapper.innerHTML = '';
            
            const searchQuery = document.getElementById('user-search').value.toLowerCase();
            const filteredData = grandDatabase.filter(item => {
                const catMatches = (activeCategory === 'All' || item.category === activeCategory);
                const textMatches = item.title.toLowerCase().includes(searchQuery) || 
                                    item.offered_by.toLowerCase().includes(searchQuery) ||
                                    item.overview.toLowerCase().includes(searchQuery);
                return catMatches && textMatches;
            });

            if (filteredData.length === 0) {
                listWrapper.innerHTML = `<div style="text-align:center; padding:48px 24px; color:#718096; background:#ffffff; border-radius:12px; border:1px solid #e2e8f0;"><div style="font-size: 1.5rem; color: #004d3d;">🔍</div><div style="font-size: 0.95rem; font-weight: 600; color: #1a202c; margin-top:8px;">No matching results located inside the query parameters.</div></div>`;
                return;
            }

            filteredData.forEach((item, index) => {
                listWrapper.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="sponsored-tag">✦ Sponsored</span>
                            <h2 class="card-title" onclick="openDetailsWindow(${index})" style="margin-top: 4px;">${item.title}</h2>
                            <p class="card-sub">Offered by ${item.offered_by}</p>
                        </div>
                        
                        <div class="info-panel">
                            <div class="info-col">
                                <span class="info-icon">💵</span>
                                <div class="info-text-group">
                                    <div class="info-label">Amount</div>
                                    <div class="info-value">${item.amount}</div>
                                </div>
                            </div>
                            <div class="info-col">
                                <span class="info-icon">📅</span>
                                <div class="info-text-group">
                                    <div class="info-label">Deadline</div>
                                    <div class="info-value">${item.deadline}</div>
                                </div>
                            </div>
                            <div class="info-col">
                                <span class="info-icon">📋</span>
                                <div class="info-text-group">
                                    <div class="info-label">Requirements</div>
                                    <div class="info-value">${item.requirements}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="overview-box">${item.overview}</div>
                        
                        <div class="card-actions-row">
                            <button class="btn-action-node secondary" onclick="openDetailsWindow(${index})">View Details</button>
                            <a href="${item.application_url || '#'}" target="_blank" class="btn-action-node primary">Apply</a>
                        </div>
                    </div>`;
            });
        }

        function openDetailsWindow(idx) {
            const targetItem = grandDatabase[idx];
            const modalBody = document.getElementById('modal-body-content');
            
            modalBody.innerHTML = `
                <div>
                    <span class="sponsored-tag" style="font-size:0.75rem;">✦ Curated System Entry</span>
                    <h1 style="font-size: 1.6rem; font-weight: 700; color: #004d3d; line-height: 1.3; margin-top:4px; text-transform: uppercase;">${targetItem.title}</h1>
                    <p style="font-size: 0.85rem; color: #718096; margin-top: 2px;">Administered by ${targetItem.offered_by} • Ref ID: SS-00${idx}</p>
                </div>
                
                <div class="tab-menu-bar">
                    <button id="trigger-about" class="tab-trigger-btn active" onclick="switchInnerTab('about')">About Program</button>
                    <button id="trigger-eligibility" class="tab-trigger-btn" onclick="switchInnerTab('eligibility')">Eligibility</button>
                    <button id="trigger-faqs" class="tab-trigger-btn" onclick="switchInnerTab('faqs')">FAQ's</button>
                </div>
                
                <div id="pane-about" class="tab-pane-content active">
                    <div class="section-headline">About The Scholarship</div>
                    <p>${targetItem.overview || "No comprehensive program summary logs archived inside current node."}</p>
                </div>
                
                <div id="pane-eligibility" class="tab-pane-content">
                    <div class="section-headline">Eligibility Requirements</div>
                    <p style="font-weight:700; color: #004d3d;">⚠️ Mandatory Baseline Thresholds:</p>
                    <p style="margin-top:2px;">${targetItem.requirements}</p>
                    <p style="margin-top:10px; color:#718096; font-size:0.85rem;">* Verified documents and income status tracking checks run automatically through background pipelines.</p>
                </div>
                
                <div id="pane-faqs" class="tab-pane-content">
                    <div class="section-headline">Frequently Asked Questions</div>
                    <div class="faq-block-row">
                        <div class="faq-question-text">Q: ${targetItem.faq_q1 || "Who administers this program tracking portal?"}</div>
                        <div style="color:#4a5568; font-size:0.9rem;">A: ${targetItem.faq_a1 || "Administered directly by verified corporate foundation tracks or state ministry boards."}</div>
                    </div>
                    <div class="faq-block-row" style="margin-top:12px;">
                        <div class="faq-question-text">Q: ${targetItem.faq_q2 || "Is renewal profile validation enforced?"}</div>
                        <div style="color:#4a5568; font-size:0.9rem;">A: ${targetItem.faq_a2 || "Maintaining standard campus academic grading levels guarantees continuation across subsequent years."}</div>
                    </div>
                </div>
                
                <a href="${targetItem.application_url || '#'}" target="_blank" class="apply-now-btn">Proceed To External Application Gate ↗</a>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function switchInnerTab(tabName) {
            document.querySelectorAll('.tab-trigger-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane-content').forEach(pane => pane.classList.remove('active'));
            
            document.getElementById('trigger-' + tabName).classList.add('active');
            document.getElementById('pane-' + tabName).classList.add('active');
        }

        function closeDetailsWindow() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function toggleNotificationHub() {
            document.getElementById('notification-hub').classList.toggle('active');
        }

        function renderNotificationHubLogs() {
            const countHeader = document.getElementById('notif-header-count');
            const listWrapper = document.getElementById('notif-dropdown-list-wrapper');
            
            countHeader.innerText = `System Notifications (${grandDatabase.length})`;
            listWrapper.innerHTML = '';
            
            grandDatabase.forEach((item) => {
                listWrapper.innerHTML += `
                    <div class="notification-item">
                        <span class="notif-tag">✦ New Ingestion Tracker</span>
                        <div class="notif-title">Pushed live listings: "${item.title}" successfully sync'd.</div>
                    </div>`;
            });
        }

        window.addEventListener('click', function(e) {
            const bellContainer = document.querySelector('.nav-actions');
            if (bellContainer && !bellContainer.contains(e.target)) {
                document.getElementById('notification-hub').classList.remove('active');
            }
        });

        function filterStream(category) {
            activeCategory = category;
            renderFilterChips();
            renderInterface();
        }

        function executeSearch() {
            renderInterface();
        }

        fetchScholarshipDatabase();
    </script>
</body>
</html>
