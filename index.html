        function initializeInterfacePipeline() {
            renderFilterChips();
            renderInterface();
            renderNotificationHubLogs();
        }

        function switchMasterSection(sectionName) {
            activeMasterTab = sectionName;
            activeCategoryFilter = 'All';
            
            document.querySelectorAll('.master-tab-toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.dashboard-view-display-pane').forEach(pane => pane.classList.remove('active'));
            
            document.getElementById('master-tab-' + sectionName).classList.add('active');
            document.getElementById('pane-section-' + sectionName).classList.add('active');
            
            renderFilterChips();
            renderInterface();
        }

        function getCategoryCount(category) {
            const searchQuery = document.getElementById('user-search').value.toLowerCase();
            const casteFilter = document.getElementById('caste-select').value;
            const stateFilter = document.getElementById('state-select').value;

            return grandDatabase.filter(item => {
                if (item.type !== activeMasterTab) return false;
                if (category !== 'All' && item.category !== category) return false;
                
                const textMatches = item.title.toLowerCase().includes(searchQuery) || 
                                    item.offered_by.toLowerCase().includes(searchQuery) ||
                                    item.overview.toLowerCase().includes(searchQuery);
                const casteMatches = (casteFilter === 'All' || item.caste.includes(casteFilter));
                const stateMatches = (stateFilter === 'All' || item.state === 'Pan-India' || item.state === stateFilter);
                
                return textMatches && casteMatches && stateMatches;
            }).length;
        }

        function renderFilterChips() {
            const wrapper = document.getElementById('filter-chips-wrapper');
            const categories = ['All', 'Engineering', 'Business', 'Govt'];
            wrapper.innerHTML = '';
            
            categories.forEach(cat => {
                const isActive = (cat === activeCategoryFilter) ? 'active' : '';
                const count = getCategoryCount(cat);
                const displayLabel = cat === 'All' ? 'All Channels' : 
                                     cat === 'Engineering' ? 'Engineering / Tech' :
                                     cat === 'Business' ? 'Business / IPMAT' : 'Government Registers';
                                     
                wrapper.innerHTML += `<button class="filter-btn ${isActive}" onclick="filterStream('${cat}')">${displayLabel} <span class="filter-count">${count}</span></button>`;
            });
        }

        function renderInterface() {
            const scholarshipWrapper = document.getElementById('pane-section-scholarships');
            const examWrapper = document.getElementById('pane-section-exams');
            
            scholarshipWrapper.innerHTML = '';
            examWrapper.innerHTML = '';
            
            const searchQuery = document.getElementById('user-search').value.toLowerCase();
            const casteFilter = document.getElementById('caste-select').value;
            const stateFilter = document.getElementById('state-select').value;

            let renderCount = 0;

            grandDatabase.forEach((item, index) => {
                if (item.type !== activeMasterTab) return;
                if (activeCategoryFilter !== 'All' && item.category !== activeCategoryFilter) return;

                const textMatches = item.title.toLowerCase().includes(searchQuery) || 
                                    item.offered_by.toLowerCase().includes(searchQuery) ||
                                    item.overview.toLowerCase().includes(searchQuery);
                                    
                const casteMatches = (casteFilter === 'All' || item.caste.includes(casteFilter));
                const stateMatches = (stateFilter === 'All' || item.state === 'Pan-India' || item.state === stateFilter);

                if (textMatches && casteMatches && stateMatches) {
                    renderCount++;
                    const cardHtml = `
                        <div class="card">
                            <div>
                                <span class="sponsored-tag">✦ Verified ${item.category}</span>
                                <h2 class="card-title" onclick="openDetailsWindow(${index})" style="margin-top: 6px;">${item.title}</h2>
                                <p class="card-sub">Offered by ${item.offered_by}</p>
                            </div>
                            
                            <div class="info-panel">
                                <div class="info-col">
                                    <div class="vector-badge-container">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                                    </div>
                                    <div class="info-text-group">
                                        <div class="info-label">Benefits / Scope</div>
                                        <div class="info-value">${item.amount}</div>
                                    </div>
                                </div>
                                <div class="info-col">
                                    <div class="vector-badge-container">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    </div>
                                    <div class="info-text-group">
                                        <div class="info-label">Timeline Deadline</div>
                                        <div class="info-value">${item.deadline}</div>
                                    </div>
                                </div>
                                <div class="info-col">
                                    <div class="vector-badge-container">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                    </div>
                                    <div class="info-text-group">
                                        <div class="info-label">Eligibility Matrix</div>
                                        <div class="info-value" style="font-size:0.8rem; color:#608074;">Caste: ${item.caste} • Region: ${item.state}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="overview-box">${item.overview}</div>
                            
                            <div class="card-actions-row">
                                <button class="btn-action-node secondary" onclick="openDetailsWindow(${index})">View Details</button>
                                <a href="${item.application_url}" target="_blank" class="btn-action-node primary">Apply Now →</a>
                            </div>
                        </div>`;

                    if (activeMasterTab === "scholarships") {
                        scholarshipWrapper.innerHTML += cardHtml;
                    } else if (activeMasterTab === "exams") {
                        examWrapper.innerHTML += cardHtml;
                    }
                }
            });

            if (renderCount === 0) {
                const emptyMsg = `<div style="text-align:center; padding:48px 24px; color:#608074; background:#ffffff; border-radius:12px; border:1px solid #cbdcd7;"><div style="font-size: 1.5rem; color: #004d3d;">🔍</div><div style="font-size: 0.95rem; font-weight: 600; color: #1c2826; margin-top:8px;">No current entry records map inside these specific filter queries.</div></div>`;
                if (activeMasterTab === "scholarships") scholarshipWrapper.innerHTML = emptyMsg;
                else examWrapper.innerHTML = emptyMsg;
            }
        }

        function openDetailsWindow(idx) {
            const targetItem = grandDatabase[idx];
            const modalBody = document.getElementById('modal-body-content');
            
            modalBody.innerHTML = `
                <div>
                    <span class="sponsored-tag">✦ Secure Data Endpoint</span>
                    <h1 style="font-size: 1.6rem; font-weight: 700; color: #004d3d; line-height: 1.3; margin-top:6px;">${targetItem.title}</h1>
                    <p style="font-size: 0.85rem; color: #608074; margin-top: 2px;">Administered by ${targetItem.offered_by} • Param Path: SS-NODE-00${idx}</p>
                </div>
                
                <div class="tab-menu-bar">
                    <button id="trigger-about" class="tab-trigger-btn active" onclick="switchInnerTab('about')">About Program</button>
                    <button id="trigger-eligibility" class="tab-trigger-btn" onclick="switchInnerTab('eligibility')">Eligibility</button>
                    <button id="trigger-faqs" class="tab-trigger-btn" onclick="switchInnerTab('faqs')">FAQ's</button>
                </div>
                
                <div id="pane-about" class="tab-pane-content active">
                    <div class="section-headline">About The Opportunity</div>
                    <p>${targetItem.overview}</p>
                </div>
                
                <div id="pane-eligibility" class="tab-pane-content">
                    <div class="section-headline">Eligibility Parameters Matrix</div>
                    <p style="font-weight:700; color: #004d3d; margin-bottom:4px;">⚠️ Verification Requirements:</p>
                    <p>${targetItem.requirements}</p>
                    <p style="margin-top:8px; font-weight:600; color:#2d3748;">Target Caste Groups: <span style="color:#004d3d;">${targetItem.caste}</span></p>
                    <p style="font-weight:600; color:#2d3748;">Domicile Location Rule: <span style="color:#004d3d;">${targetItem.state}</span></p>
                </div>
                
                <div id="pane-faqs" class="tab-pane-content">
                    <div class="section-headline">Frequently Asked Questions</div>
                    <div class="faq-block-row">
                        <div class="faq-question-text">Q: ${targetItem.faq_q1}</div>
                        <div style="color:#4a5568; font-size:0.9rem;">A: ${targetItem.faq_a1}</div>
                    </div>
                    <div class="faq-block-row" style="margin-top:12px;">
                        <div class="faq-question-text">Q: ${targetItem.faq_q2}</div>
                        <div style="color:#4a5568; font-size:0.9rem;">A: ${targetItem.faq_a2}</div>
                    </div>
                </div>
                
                <a href="${targetItem.application_url}" target="_blank" class="apply-now-btn">Proceed To Direct Registration Portal ↗</a>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function switchInnerTab(tabName) {
            document.querySelectorAll('.tab-trigger-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane-content').forEach(pane => pane.classList.remove('active'));
            
            document.getElementById('trigger-' + tabName).classList.add('active');
            document.getElementById('pane-' + tabName).classList.add('active');
        }

        function closeDetailsWindow() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function toggleNotificationHub() {
            document.getElementById('notification-hub').classList.toggle('active');
        }

        function renderNotificationHubLogs() {
            const countHeader = document.getElementById('notif-header-count');
            const listWrapper = document.getElementById('notif-dropdown-list-wrapper');
            
            countHeader.innerText = `System Notifications (${grandDatabase.length})`;
            listWrapper.innerHTML = '';
            
            grandDatabase.forEach((item) => {
                listWrapper.innerHTML += `
                    <div class="notification-item">
                        <span class="notif-tag">✦ Live Node Synced</span>
                        <div class="notif-title">Registry record "${item.title}" mapped securely.</div>
                    </div>`;
            });
        }

        window.addEventListener('click', function(e) {
            const bellButton = document.querySelector('.notification-bell');
            if (bellButton && !bellButton.contains(e.target)) {
                document.getElementById('notification-hub').classList.remove('active');
            }
        });

        function filterStream(category) {
            activeCategoryFilter = category;
            renderFilterChips();
            renderInterface();
        }

        function executeSearch() {
            renderFilterChips();
            renderInterface();
        }

        fetchScholarshipDatabase();
    </script>
</body>
</html>
