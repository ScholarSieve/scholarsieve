        /* Luxury Elite Brand Framework */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

        /* MODERN NOTIFICATION BELL MODULE STYLING */
        .nav-actions { position: relative; display: flex; align-items: center; }
        .notification-bell {
            background: none; border: none; cursor: pointer; position: relative; padding: 8px; color: #94a3b8; font-size: 1.4rem; transition: color 0.2s;
        }
        .notification-bell:hover { color: #d4af37; }
        .bell-dot {
            position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 2px solid #0d1321;

        .notification-dropdown {
            position: absolute; top: 45px; right: 0; width: 340px; background: #0d1321; border: 1px solid #1e293b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; z-index: 200;

        .notification-dropdown.active { display: flex; }
        .dropdown-header { padding: 14px 18px; border-bottom: 1px solid #1e293b; font-size: 0.85rem; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 0.05em; background: #090d16; }

        /* Premium Card Layout Elements */
        .card { background: #0d1321; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; margin-bottom: 28px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: left; transition: transform 0.2s ease, border-color 0.2s ease; }

        .card-title { font-size: 1.4rem; font-weight: 800; color: #ffffff; }
        .card-sub { font-size: 0.85rem; color: #64748b; margin-top: 2px; }
        
        .info-panel { display: grid; grid-template-columns: repeat(3, 1fr); background: #090d16; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; gap: 16px; }
        .info-col { display: flex; flex-direction: column; }
        .info-label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .info-value { font-size: 0.95rem; font-weight: 700; color: #d4af37; margin-top: 6px; }
        .info-value.dark { color: #e2e8f0; }

        .view-details-btn {
            background: transparent; border: 1px solid #d4af37; color: #d4af37; padding: 10px 22px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.02em;
        }
        .view-details-btn:hover { background: rgba(212, 175, 55, 0.08); }
        
        /* ITEM 2: Interactive "View Details" Panel Overlay System (Modal) */
        .details-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 14, 0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .details-overlay.active { opacity: 1; pointer-events: auto; }
        .details-window {
            background: #0d1321; border: 1px solid #1e293b; width: 90%; max-width: 650px; border-radius: 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); } to { transform: translateY(0); } }
        .close-btn { position: absolute; top: 20px; right: 24px; font-size: 1.8rem; color: #64748b; cursor: pointer; background: none; border: none; outline: none; }
        .close-btn:hover { color: #ffffff; }
        .window-body { padding: 40px; display: flex; flex-direction: column; gap: 24px; text-align: left; }
        .section-header { font-size: 0.75rem; font-weight: 800; color: #d4af37; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }

        .faq-a { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }
        .apply-now-btn {

    </style>
