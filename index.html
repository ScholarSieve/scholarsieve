<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarSieve - Premium Student Data Vault</title>
    <style>
        /* Luxury Elite Brand Framework (Works 100% Offline) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16; /* Deep Midnight Obsidian */
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        nav {
            background: #0d1321;
            border-bottom: 1px solid #1e293b;
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.3rem; font-weight: 900; letter-spacing: 0.05em; color: #ffffff; text-transform: uppercase; }
        .logo span { color: #d4af37; font-weight: 300; border-left: 1px solid #334155; margin-left: 8px; padding-left: 8px; }
        main { max-width: 900px; width: 95%; margin: 56px auto; }
        .hero { margin-bottom: 48px; border-left: 2px solid #d4af37; padding-left: 24px; }
        .hero h1 { font-size: 2.8rem; font-weight: 800; color: #ffffff; tracking-tight: -0.03em; }
        .hero p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-top: 8px; }
        .search-box {
            width: 100%; max-width: 480px; padding: 16px 20px; background: #0d1321; border: 1px solid #1e293b; border-radius: 12px; font-size: 0.95rem; color: #ffffff; outline: none; margin-bottom: 32px; transition: all 0.3s ease;
        }
        .search-box:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid #1e293b; }
        .filter-btn {
            background: #0d1321; border: 1px solid #1e293b; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; font-weight: 700; color: #94a3b8; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .filter-btn:hover, .filter-btn.active { background: #d4af37; color: #090d16; border-color: #d4af37; }
        .card { background: #0d1321; border: 1px solid #1e293b; border-radius: 16px; padding: 28px; margin-bottom: 28px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .badge { display: inline-block; font-size: 0.65rem; font-weight: 800; color: #d4af37; background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); padding: 6px 12px; border-radius: 6px; text-transform: uppercase; width: max-content; }
        .card-title { font-size: 1.4rem; font-weight: 800; color: #ffffff; }
        .card-sub { font-size: 0.85rem; color: #64748b; margin-top: 2px; }
        .info-panel { display: grid; grid-template-columns: repeat(3, 1fr); background: #090d16; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; gap: 16px; }
        .info-col { display: flex; flex-direction: column; }
        .info-label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .info-value { font-size: 0.95rem; font-weight: 700; color: #d4af37; margin-top: 6px; }
        .info-value.dark { color: #e2e8f0; }
        .overview-box { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; padding: 16px 20px; background: rgba(30, 41, 59, 0.2); border-left: 3px solid #d4af37; border-radius: 0 8px 8px 0; }
        footer { background: #0d1321; border-top: 1px solid #1e293b; padding: 40px; margin-top: 80px; text-align: center; }
        .founder-card { display: flex; align-items: center; gap: 18px; background: rgba(212, 175, 55, 0.03); border: 1px solid rgba(212, 175, 55, 0.15); padding: 16px 28px; border-radius: 14px; max-width: 380px; margin: 24px auto 0 auto; text-align: left; }
        .founder-avatar { width: 44px; height: 44px; border-radius: 50%; background: #d4af37; color: #090d16; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">SCHOLAR<span>SIEVE</span></div>
    </nav>

    <main>
        <div class="hero">
            <h1>Elite Scholarship & Portal Registry</h1>
            <p>An immaculate, conflict-free information network for higher education metrics. Hand-curated verification tracking schemas designed exclusively for independent student analysis.</p>
        </div>

        <input type="text" id="user-search" class="search-box" oninput="executeSearch()" placeholder="Filter the ledger by title, parameters, keywords...">

        <div class="filter-group">
            <button class="filter-btn active" onclick="filterStream('All')">All Opportunities</button>
            <button class="filter-btn" onclick="filterStream('Engineering')">Engineering / Tech</button>
            <button class="filter-btn" onclick="filterStream('Business')">Business / IPMAT</button>
            <button class="filter-btn" onclick="filterStream('Medical')">Medical / NEET</button>
            <button class="filter-btn" onclick="filterStream('Govt')">Government Registers</button>
            <button class="filter-btn" onclick="filterStream('Abroad')">Global Fellowships</button>
        </div>

        <div id="dashboard-view"></div>
    </main>

    <footer>
        <div class="logo">SCHOLAR<span>SIEVE</span></div>
        <div class="founder-card">
            <div class="founder-avatar">N</div>
            <div>
                <div style="font-size: 0.65rem; color: #d4af37; font-weight: 800; text-transform: uppercase;">Project Founder</div>
                <div style="font-size: 1rem; font-weight: 800; color: #ffffff;">Nikhil</div>
                <div style="font-size: 0.75rem; color: #94a3b8;">Lead Systems Architect</div>
            </div>
        </div>
    </footer>

    <script>
               // Dynamic system array variable to hold the scraped ledger items
        let grandDatabase = [];
        let activeCategory = 'All';

        // AUTOMATED RECOVERY SYNC ENGINE: Reads the text blocks from your desktop json file
        async function fetchScholarshipDatabase() {
            try {
                const response = await fetch('live_database.json');
                if (!response.ok) {
                    throw new Error("Local database file not synced yet.");
                }
                grandDatabase = await response.json();
                renderInterface(grandDatabase);
            } catch (error) {
                console.log("Ingestion point charging. Loading diagnostic matrix defaults.");
                // High-yield fallback catalog arrays to preserve luxury layout rendering if network is sleeping
                grandDatabase = [
                    {
                        category: "Govt",
                        title: "PM-USP Central Sector Scholarship Scheme",
                        offered_by: "Ministry of Education, Govt of India",
                        amount: "₹20,000 / Year Flat Academic Grant",
                        deadline: "October 31, 2026 (Active Intake)",
                        requirements: "Family Income < 4.5L + Above 80th Percentile in Board",
                        overview: "Central sector support architecture for top-tier undergraduate college rankers. Requires validated profiles on the National Scholarship Portal."
                    },
                    {
                        category: "Engineering",
                        title: "Reliance Foundation Undergraduate Scholarships",
                        offered_by: "Reliance Foundation Corporate CSR",
                        amount: "Up to ₹2,00,000 Flat Educational Allowance",
                        deadline: "November 15, 2026 (Live Application Window)",
                        requirements: "First-year regular student + Family Income < 15L",
                        overview: "Premium private sector grant designed to support meritorious Indian students pursuing full-time undergraduate engineering and degree courses."
                    }
                ];
                renderInterface(grandDatabase);
            }
        }


        // UI Card Component Matrix Generator Engine
        function renderInterface(dataset) {
            const listWrapper = document.getElementById('dashboard-view');
            listWrapper.innerHTML = '';

            if (dataset.length === 0) {
                listWrapper.innerHTML = `
                    <div style="text-align:center; padding:48px 24px; color:#64748b; background:#0d1321; border-radius:16px; border:1px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                        <div style="font-size: 2rem; color: #d4af37;">🔍</div>
                        <div style="font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-top: 12px;">No matching records located inside current ledger filters.</div>
                    </div>`;
                return;
            }

            dataset.forEach(item => {
                listWrapper.innerHTML += `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
                            <div>
                                <span class="badge">${item.category} Matrix</span>
                                <h2 class="card-title" style="margin-top: 10px;">${item.title}</h2>
                                <p class="card-sub">Verified Record • Administered by ${item.offered_by}</p>
                            </div>
                        </div>

                        <div class="info-panel">
                            <div class="info-col">
                                <div class="info-label">Benefits & Rewards</div>
                                <div class="info-value">${item.amount}</div>
                            </div>
                            <div class="info-col" style="border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; padding-left: 16px; padding-right: 16px;">
                                <div class="info-label">Closing Timeline</div>
                                <div class="info-value dark">${item.deadline}</div>
                            </div>
                            <div class="info-col" style="padding-left: 8px;">
                                <div class="info-label">Base Parameters</div>
                                <div class="info-value dark">${item.requirements}</div>
                            </div>
                        </div>

                        <div class="overview-box">
                            ${item.overview}
                        </div>
                    </div>
                `;
            });
        }

        // Logic Filter & Query Calculations Array Engine
        let activeCategory = 'All';
        function filterStream(category) {
            activeCategory = category;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (window.event && window.event.target) {
                window.event.target.classList.add('active');
            }
            executeSearch();
        }

        function executeSearch() {
            const searchQuery = document.getElementById('user-search').value.toLowerCase();
            const matchingOutput = grandDatabase.filter(item => {
                const categoryMatches = (activeCategory === 'All' || item.category === activeCategory);
                const stringMatches = item.title.toLowerCase().includes(searchQuery) || 
                                      item.offered_by.toLowerCase().includes(searchQuery) ||
                                      item.overview.toLowerCase().includes(searchQuery);
                return categoryMatches && stringMatches;
            });
            renderInterface(matchingOutput);
        }

        // Boot Bootstrapping Initializer
        fetchScholarshipDatabase();

    </script>
</body>
</html>
