name: Automated Daily Scholarship Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Triggers automatically every single day at midnight
  workflow_dispatch: # Allows you to run it manually anytime with 1 click

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Source Files
      uses: actions/checkout@v3

    - name: Load Cloud Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Execute Automated Script Ingestion
      run: python scraper.py

    - name: Commit and Sync Live Database Array
      run: |
        git config --global user.name "ScholarSieve-Bot"
        git config --global user.email "bot@scholarsieve.com"
        git add live_database.json
        git commit -m "Automated daily cloud data sync [Skip CI]" || exit 0
        git push
